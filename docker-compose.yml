services:
  # 后台爬虫服务
  spider:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    container_name: workspace-spider
    restart: always
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./spider.py:/app/spider.py:ro
      - ./crawler:/app/crawler:ro
      - ./requirements.txt:/app/requirements.txt:ro
      - ./public:/app/public
      - ./runtime_config.py:/app/runtime_config.py:ro
      - crawler-state:/app/state:ro
      - spider-cache:/app/cache
    environment:
      - TZ=Asia/Shanghai
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_API_TIMEOUT=${GITHUB_API_TIMEOUT:-20}
      - TRANSLATE_API_TIMEOUT=${TRANSLATE_API_TIMEOUT:-15}
      - PIPELINE_JOB_TIMEOUT_SECONDS=${PIPELINE_JOB_TIMEOUT_SECONDS:-1800}
      - WEATHER_LATITUDE=${WEATHER_LATITUDE:-41.80}
      - WEATHER_LONGITUDE=${WEATHER_LONGITUDE:-123.43}
      - FORUM_POLL_INTERVAL_SECONDS=${FORUM_POLL_INTERVAL_SECONDS:-300}
      - FORUM_ITEMS_PER_SOURCE=${FORUM_ITEMS_PER_SOURCE:-30}
      - CRAWLER_CONFIG_PATH=/app/state/crawler-settings.json
      - SPIDER_CACHE_DIR=/app/cache
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # 健康检查：探 heartbeat 文件，快线程等待抓取时也每分钟更新。
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time,sys; p='/app/public/heartbeat.txt'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 300 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 180s

  # 管理 API 只在 Compose 内部监听，由 Web 的同源 HTTPS 入口转发。
  control:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    command: ["python", "-u", "control_api.py"]
    restart: always
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    security_opt:
      - no-new-privileges:true
    volumes:
      - crawler-state:/app/state
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_COOKIE_SECURE=${ADMIN_COOKIE_SECURE:-true}
      - CRAWLER_CONFIG_PATH=/app/state/crawler-settings.json
      - WEATHER_LATITUDE=${WEATHER_LATITUDE:-41.80}
      - WEATHER_LONGITUDE=${WEATHER_LONGITUDE:-123.43}
      - WEATHER_CITY=${WEATHER_CITY:-默认城市}
      - FORUM_POLL_INTERVAL_SECONDS=${FORUM_POLL_INTERVAL_SECONDS:-300}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:1884/api/admin/status', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 前端 Web 服务 (Nginx)
  web:
    image: nginx:alpine
    container_name: workspace-web
    restart: always
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-1881}:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./security-headers.conf:/etc/nginx/conf.d/security-headers.conf:ro
    environment:
      - TZ=Asia/Shanghai
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # 健康检查：探首页可访问性（用 127.0.0.1 避开容器 IPv6 解析）。
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - spider
      - control

volumes:
  crawler-state:
  spider-cache:
