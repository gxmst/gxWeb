<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Vibe Workspace</title>
    <link rel="icon" type="image/png" href="./favicon.png">
    <!-- 字体：本地自托管 Inter（正文）+ JetBrains Mono（数字），仅含 latin/latin-ext 子集 -->
    <link rel="stylesheet" href="./fonts/fonts.css">
    <!-- Tailwind：静态预编译产物（由 `npm run build:css` 生成）。改动 class 后需重新构建。 -->
    <link rel="stylesheet" href="./vendor/app.css?v=settings-20260716a">
    <!-- 自定义样式：从旧单文件 <style> 拆分为四个职责文件。
         base=字体/时钟/骨架；glass=玻璃材质/折射/氛围；components=时间轴/光斑/磁吸/Tab；effects=时段/雷暴/晴天/星空 -->
    <link rel="stylesheet" href="./css/base.css?v=settings-20260716a">
    <link rel="stylesheet" href="./css/glass.css?v=settings-20260716a">
    <link rel="stylesheet" href="./css/components.css?v=settings-20260716a">
    <link rel="stylesheet" href="./css/effects.css?v=settings-20260716a">
    <!-- DOMPurify：模块化脚本通过全局 DOMPurify 引用，须在 main.js 之前以经典脚本加载 -->
    <script src="./vendor/purify.min.js"></script>
</head>

<body
    class="min-h-screen w-full text-white font-sans bg-gray-900 flex flex-col md:flex-row md:h-screen md:overflow-hidden overflow-x-hidden overflow-y-auto no-scrollbar">

    <!-- 玻璃折射用 SVG 滤镜：feTurbulence 噪声 → feDisplacementMap 让背景透过玻璃微微扭曲流动。
         默认隐藏、不占布局；仅被支持 url() backdrop-filter 的浏览器引用（见 html.glass-refract）。 -->
    <svg width="0" height="0" style="position:absolute;pointer-events:none" aria-hidden="true">
        <filter id="glassDisplace" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.013 0.017" numOctaves="2" seed="7" result="noise">
                <animate attributeName="baseFrequency" dur="26s"
                    values="0.013 0.017;0.018 0.012;0.013 0.017" repeatCount="indefinite" />
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="58"
                xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>

    <!-- 动态背景 -->
    <div class="fixed inset-0 z-0 overflow-hidden">
        <img id="bgImage1" translate="no" src=""
            class="absolute inset-0 w-full h-full object-cover pointer-events-none select-none transition-opacity duration-1000 ease-in-out z-[1] opacity-0"
            alt="">
        <img id="bgImage2" translate="no" src=""
            class="absolute inset-0 w-full h-full object-cover pointer-events-none select-none transition-opacity duration-1000 ease-in-out z-[2] opacity-0"
            alt="">

        <!-- WebGL 流体涟漪层：采样当前壁纸做折射位移，鼠标划过注入衰减同心波。
             盖在壁纸图之上、氛围光/遮罩之下；WebGL 不可用或省电模式下永不显示，壁纸 img 照常露出。 -->
        <canvas id="fluidCanvas" class="absolute inset-0 w-full h-full pointer-events-none z-[3] opacity-0"
            style="transition:opacity 1s ease;"></canvas>

        <!-- 壁纸取色驱动的氛围光与可读性遮罩 -->
        <div class="ambient-glow ambient-glow-main"></div>
        <div class="ambient-glow ambient-glow-low"></div>
        <div id="sceneShade"></div>

        <!-- 动态天气滤镜层 -->
        <div id="weatherOverlay" class="absolute inset-0 transition-colors duration-1000 z-20" style="background-color: rgba(0, 0, 0, 0.16);"></div>

        <!-- 时段自适应色调（很淡，soft-light 叠色） -->
        <div id="timeTint"></div>
        <!-- 晴天柔和光束光晕 -->
        <div id="sunGlow"></div>
        <!-- 多云缓慢飘过的云影 -->
        <div id="cloudLayer"></div>
        <!-- 雾/霾缓慢横向飘动的雾气 -->
        <div id="fogLayer"></div>
        <!-- 夜晚缓慢闪烁星空 -->
        <canvas id="starCanvas" class="absolute inset-0 pointer-events-none z-[13]" style="opacity:0;transition:opacity 1.6s ease;"></canvas>
    </div>

    <!-- 物理粒子画布：提到面板之上，雨雪/水流才能落在控件表面（不拦截交互） -->
    <canvas id="weatherCanvas" class="fixed inset-0 z-40 pointer-events-none"></canvas>

    <!-- 雷暴闪电泛光层（雨模式下偶发，不拦截交互） -->
    <div id="lightningFlash" class="fixed inset-0 z-[41] pointer-events-none opacity-0"></div>

    <!-- 左上角：控制中心 -->
    <div class="absolute top-6 left-6 flex gap-4 z-30">
        <button id="wallpaperBtn" type="button" disabled style="opacity: 0.5; pointer-events: none;"
            class="w-10 h-10 glass rounded-full flex items-center justify-center hover:scale-110 active:scale-95 transition-all group shadow-lg outline-none focus:outline-none"
            title="切换壁纸" aria-label="切换壁纸">
            <svg class="w-5 h-5 text-white/70 group-hover:text-white" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z">
                </path>
            </svg>
        </button>
        <button id="filterBtn" type="button"
            class="w-10 h-10 glass rounded-full flex items-center justify-center hover:scale-110 active:scale-95 transition-all group shadow-lg text-lg outline-none focus:outline-none"
            title="切换环境滤镜" aria-label="切换环境滤镜">✨</button>
        <button id="settingsBtn" type="button" aria-expanded="false" aria-controls="settingsOverlay"
            class="w-10 h-10 glass rounded-full flex items-center justify-center hover:scale-110 active:scale-95 transition-all group shadow-lg outline-none focus:outline-none"
            title="设置" aria-label="打开设置">
            <svg class="w-5 h-5 text-white/70 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 15.5a3.5 3.5 0 100-7 3.5 3.5 0 000 7z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19.4 15a1.7 1.7 0 00.34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0015 19.4a1.7 1.7 0 00-1 .6 1.7 1.7 0 00-.4 1.1V21H9.6v-.1A1.7 1.7 0 008.5 19.3a1.7 1.7 0 00-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 004.1 15a1.7 1.7 0 00-.6-1 1.7 1.7 0 00-1.1-.4H2.3V9.6h.1A1.7 1.7 0 004 8.5a1.7 1.7 0 00-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 008.4 4.1a1.7 1.7 0 001-.6 1.7 1.7 0 00.4-1.1V2.3h4v.1A1.7 1.7 0 0015 4a1.7 1.7 0 001.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0019.4 8.4a1.7 1.7 0 00.6 1 1.7 1.7 0 001.1.4h.1v4h-.1A1.7 1.7 0 0019.4 15z"></path>
            </svg>
        </button>
        <button id="rippleBtn" type="button" aria-pressed="false"
            class="hidden md:flex w-10 h-10 glass rounded-full items-center justify-center hover:scale-110 active:scale-95 transition-all group shadow-lg outline-none focus:outline-none"
            title="开启轻量背景涟漪" aria-label="背景涟漪">
            <svg class="w-5 h-5 text-white/70 group-hover:text-white" fill="none" stroke="currentColor"
                viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                    d="M3 8.5c2.25-2 4.5-2 6.75 0s4.5 2 6.75 0 4.5-2 6.75 0M.75 15.5c2.25-2 4.5-2 6.75 0s4.5 2 6.75 0 4.5-2 6.75 0">
                </path>
            </svg>
        </button>
    </div>

    <!-- 主体内容区 (左侧) -->
    <main
        class="relative z-10 flex flex-col items-center justify-center w-full min-h-[540px] px-5 pt-24 pb-12 md:flex-1 md:min-h-0 md:p-8 md:pb-20">
        <!-- 时间与天气 -->
        <div class="flex flex-col items-center mb-7 md:mb-10" data-enter style="--enter-delay:0.05s">
            <div id="clock"
                class="text-6xl md:text-7xl font-semibold tracking-tight numeric drop-shadow-[0_4px_8px_rgba(0,0,0,0.6)]">00:00
            </div>
            <div
                class="flex flex-wrap items-center justify-center gap-x-3 gap-y-1 text-white/90 text-sm mt-4 tracking-wider drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)] font-medium">
                <span id="dateInfo">获取日期中...</span>
                <span class="opacity-40">|</span>
                <span id="weatherInfo">获取天气中...</span>
            </div>
        </div>

        <!-- 融合搜索框 (内嵌引擎选择) -->
        <div id="search-bar" data-enter data-tilt="7" style="--enter-delay:0.14s"
            class="glass-spot w-full max-w-2xl glass-panel rounded-full flex items-center p-1.5 pr-2 md:pr-4 mb-8 md:mb-12 transition-all duration-300 hover:scale-[1.01] focus-within:scale-[1.02] focus-within:ring-4 focus-within:ring-white/20 focus-within:bg-white/10 overflow-hidden">
            <svg class="w-5 h-5 text-white/50 ml-3 md:ml-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <input type="text" id="searchInput" placeholder="在网络上搜索..." aria-label="网络搜索关键词"
                class="flex-1 min-w-[8rem] bg-transparent border-none outline-none text-white px-3 md:px-4 text-base placeholder-white/60">

            <select id="searchEngineSelect" aria-label="搜索引擎"
                class="md:hidden h-10 max-w-[5.5rem] shrink-0 rounded-full border border-white/15 bg-black/25 px-3 text-sm font-medium text-white outline-none">
                <option value="bing">必应</option>
                <option value="baidu">百度</option>
                <option value="google">谷歌</option>
                <option value="duck">Duck</option>
            </select>

            <!-- 内嵌引擎切换 -->
            <div class="hidden md:flex gap-2 pr-1 shrink-0">
                <button type="button" data-engine="bing" id="eng-bing" aria-pressed="false"
                    class="engine-btn px-3 py-1 rounded-full text-[11px] font-medium transition-all shrink-0">必应</button>
                <button type="button" data-engine="baidu" id="eng-baidu" aria-pressed="false"
                    class="engine-btn px-3 py-1 rounded-full text-[11px] font-medium transition-all shrink-0">百度</button>
                <button type="button" data-engine="google" id="eng-google" aria-pressed="false"
                    class="engine-btn px-3 py-1 rounded-full text-[11px] font-medium transition-all shrink-0">谷歌</button>
                <button type="button" data-engine="duck" id="eng-duck" aria-label="使用 DuckDuckGo 搜索" aria-pressed="false"
                    class="engine-btn px-3 py-1 rounded-full text-[11px] font-medium transition-all shrink-0">D</button>
            </div>
        </div>

        <!-- 快捷导航 Dock (去包装悬浮态) -->
        <div id="dockRow" data-enter style="--enter-delay:0.22s"
            class="flex gap-7 md:gap-10 px-4 py-3 md:py-4 w-full max-w-fit overflow-x-auto no-scrollbar snap-x">
            <a href="https://bilibili.com" data-shortcut-id="bilibili" target="_blank" rel="noopener noreferrer"
                class="flex flex-col items-center gap-3 group transition-all hover:-translate-y-2 shrink-0">
                <div
                    class="dock-ico w-12 h-12 bg-white/10 backdrop-blur-md border border-white/20 text-white rounded-2xl flex items-center justify-center group-hover:bg-[#FB7299] group-hover:text-white group-hover:border-transparent group-hover:scale-110 group-hover:shadow-[0_0_20px_rgba(251,114,153,0.4)] transition-all duration-300 shadow-lg">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path
                            d="M17.813 4.653h.854c1.51.054 2.769.578 3.773 1.574 1.004.995 1.524 2.249 1.56 3.76v7.36c-.036 1.51-.556 2.769-1.56 3.765-1.004.995-2.263 1.519-3.773 1.573H5.32c-1.51-.054-2.769-.578-3.773-1.573-1.004-.996-1.524-2.255-1.56-3.765V10c.036-1.511.556-2.765 1.56-3.76 1.004-.996 2.263-1.52 3.773-1.574h.774l-1.174-1.12a1.234 1.234 0 0 1-.373-.906c0-.356.124-.658.373-.907l.027-.027c.267-.249.573-.373.92-.373.347 0 .653.124.92.373L9.653 4.44c.071.071.134.142.187.213h4.267a.836.836 0 0 1 .16-.213l2.853-2.747c.267-.249.573-.373.92-.373.347 0 .662.124.946.373.285.249.427.551.427.907 0 .328-.124.63-.374.906l-1.227 1.147zM5 10v7.36c.007.622.231 1.14.671 1.554.44.413.965.626 1.574.639h13.507c.609-.013 1.134-.226 1.574-.639.44-.413.664-.932.671-1.554V10c-.007-.622-.231-1.14-.671-1.554-.44-.413-.965-.626-1.574-.639H7.245c-.609.013-1.134.226-1.574.639C5.231 8.86 5.007 9.378 5 10zm3.867 2.533c.373 0 .68.12.92.36.24.24.36.547.36.92 0 .373-.12.68-.36.92-.24.24-.547.36-.92.36-.373 0-.68-.12-.92-.36-.24-.24-.36-.547-.36-.92 0-.373.12-.68.36-.92.24-.24.547-.36.92-.36zm6.266 0c.374 0 .68.12.92.36.24.24.36.547.36.92 0 .373-.12.68-.36.92-.24.24-.546.36-.92.36-.373 0-.68-.12-.92-.36-.24-.24-.36-.547-.36-.92 0-.373.12-.68.36-.92.24-.24.546-.36.92-.36z" />
                    </svg>
                </div>
                <span
                    class="text-xs text-white/90 font-medium drop-shadow-md group-hover:text-white transition-colors">Bilibili</span>
            </a>
            <a href="https://x.com" data-shortcut-id="twitter" target="_blank" rel="noopener noreferrer"
                class="flex flex-col items-center gap-3 group transition-all hover:-translate-y-2 shrink-0">
                <div
                    class="dock-ico w-12 h-12 bg-white/10 backdrop-blur-md border border-white/20 text-white rounded-2xl flex items-center justify-center group-hover:bg-black group-hover:text-white group-hover:border-transparent group-hover:scale-110 group-hover:shadow-[0_0_20px_rgba(255,255,255,0.2)] transition-all duration-300 shadow-lg">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                        <path
                            d="M18.244 2.25h3.308l-7.227 7.719 8.502 11.281h-6.657l-5.213-6.817L4.99 21.25H1.68l7.73-8.235L1.25 2.25h6.826l4.704 6.217 5.464-6.217zM17.082 19.27h1.833L7.006 4.185H5.038L17.082 19.27z" />
                    </svg>
                </div>
                <span
                    class="text-xs text-white/90 font-medium drop-shadow-md group-hover:text-white transition-colors">Twitter</span>
            </a>
            <a href="https://github.com" data-shortcut-id="github" target="_blank" rel="noopener noreferrer"
                class="flex flex-col items-center gap-3 group transition-all hover:-translate-y-2 shrink-0">
                <div
                    class="dock-ico w-12 h-12 bg-white/10 backdrop-blur-md border border-white/20 text-white rounded-2xl flex items-center justify-center group-hover:bg-[#333333] group-hover:text-white group-hover:border-transparent group-hover:scale-110 group-hover:shadow-[0_0_20px_rgba(255,255,255,0.2)] transition-all duration-300 shadow-lg">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path
                            d="M12 .297c-6.63 0-11.5 5.373-11.5 12 0 5.303 3.438 9.8 8.205 11.385.575.105.785-.25.785-.555 0-.27-.01-1.05-.015-2.06-3.197.69-3.872-1.54-3.872-1.54-.522-1.327-1.275-1.68-1.275-1.68-1.044-.712.08-.698.08-.698 1.155.08 1.762 1.185 1.762 1.185 1.026 1.758 2.646 1.25 3.29.956.104-.744.425-1.25.777-1.538-2.55-.29-5.23-1.275-5.23-5.677 0-1.253.448-2.277 1.183-3.077-.117-.29-.513-1.458.113-3.034 0 0 .964-.31 3.155 1.175a10.97 10.97 0 0 1 2.875-.387c.975.005 1.95.13 2.875.387 2.19-1.485 3.153-1.175 3.153-1.175.628 1.576.232 2.744.115 3.034.738.8 1.181 1.824 1.181 3.077 0 4.412-2.685 5.384-5.242 5.666.413.356.78 1.055.78 2.127 0 1.535-.014 2.774-.014 3.15 0 .308.21.665.793.548C18.563 22.092 22 17.592 22 12.297c0-6.627-4.87-12-11.5-12z" />
                    </svg>
                </div>
                <span
                    class="text-xs text-white/90 font-medium drop-shadow-md group-hover:text-white transition-colors">GitHub</span>
            </a>
            <a href="https://douyin.com" data-shortcut-id="douyin" target="_blank" rel="noopener noreferrer"
                class="flex flex-col items-center gap-3 group transition-all hover:-translate-y-2 shrink-0">
                <div
                    class="dock-ico w-12 h-12 bg-white/10 backdrop-blur-md border border-white/20 text-white rounded-2xl flex items-center justify-center group-hover:bg-[#FE2C55] group-hover:text-white group-hover:border-transparent group-hover:scale-110 group-hover:shadow-[0_0_20px_rgba(254,44,85,0.4)] transition-all duration-300 font-bold shadow-lg">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">

                    </svg>
                </div>
                <span
                    class="text-xs text-white/90 font-medium drop-shadow-md group-hover:text-white transition-colors">抖音</span>
            </a>
            <a href="https://discord.com" data-shortcut-id="discord" target="_blank" rel="noopener noreferrer"
                class="flex flex-col items-center gap-3 group transition-all hover:-translate-y-2 shrink-0">
                <div
                    class="dock-ico w-12 h-12 bg-white/10 backdrop-blur-md border border-white/20 text-white rounded-2xl flex items-center justify-center group-hover:bg-[#5865F2] group-hover:text-white group-hover:border-transparent group-hover:scale-110 group-hover:shadow-[0_0_20px_rgba(88,101,242,0.4)] transition-all duration-300 font-bold shadow-lg">

                    class="text-xs text-white/90 font-medium drop-shadow-md group-hover:text-white transition-colors">Discord</span>

    </main>

    <!-- 右侧：金融快讯面板 -->
    <aside class="relative z-10 w-full px-3 pt-3 pb-16 flex flex-col group/aside md:w-[450px] md:h-screen md:p-6">
        <!-- 拖拽手柄 -->
        <div id="resizer"
            class="hidden md:block absolute left-0 top-0 w-1.5 h-full cursor-ew-resize z-20 hover:bg-white/30 transition-colors group-hover/aside:bg-white/10">
        </div>

        <div id="news-panel" data-enter data-tilt="3" style="--enter-delay:0.30s"
            class="glass-spot glass-panel flex-none rounded-2xl md:rounded-3xl p-4 md:p-6 flex flex-col overflow-visible md:overflow-hidden relative md:flex-1">
            <!-- 标题栏 -->
            <div class="relative mb-3 border-b border-white/10 pb-3 md:mb-4 md:pb-4">
                <div class="flex items-center justify-between gap-3">
                    <h2 class="text-base md:text-lg font-bold tracking-wider text-white/90">7x24 市场快讯</h2>
                    <button id="systemStatusButton" type="button" aria-expanded="false" aria-controls="systemStatusPopover"
                        class="h-9 shrink-0 flex items-center gap-2 rounded-lg border border-white/10 bg-white/5 px-3 text-xs text-white/75 transition-colors hover:bg-white/10">
                        <span id="systemStatusDot" class="h-2 w-2 rounded-full bg-amber-400"></span>
                        <span id="systemStatusText">检查中</span>
                        <svg class="h-3.5 w-3.5 text-white/50" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                </div>
                <div class="mt-2 flex items-center justify-between gap-3">
                    <div class="flex items-center gap-1 bg-white/5 p-0.5 rounded-md text-[10px] border border-white/5" role="group" aria-label="快讯字号">
                        <button type="button" data-font-size="sm" id="fs-sm" aria-pressed="true"
                            class="h-8 min-w-8 px-2 rounded transition-all bg-white/20 text-white shadow-sm">小</button>
                        <button type="button" data-font-size="base" id="fs-base" aria-pressed="false"

                    </div>
                    <span id="lastUpdateTime" class="text-[10px] numeric text-white/45">更新中...</span>
                </div>

                <div id="systemStatusPopover" hidden

                    <div class="mb-3 flex flex-wrap items-center gap-x-3 gap-y-2 border-b border-white/10 pb-3">
                        <div id="newsHeartbeatStatus" class="flex items-center gap-1" role="status" aria-live="polite" title="快讯连接中">
                            <span class="text-white/50">快讯</span>
                            <span id="newsStatusText" class="text-[10px] font-bold text-amber-400">连接中</span>
                            <span class="relative flex h-2 w-2">
                                <span id="newsStatusPing" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                                <span id="newsStatusDot" class="relative inline-flex rounded-full h-2 w-2 bg-amber-500"></span>
                            </span>
                        </div>
                        <div id="tickerHeartbeatStatus" class="flex items-center gap-1" role="status" aria-live="polite" title="行情连接中">
                            <span class="text-white/50">行情</span>
                            <span id="tickerStatusText" class="text-[10px] font-bold text-amber-400">连接中</span>
                            <span class="relative flex h-2 w-2">
                                <span id="tickerStatusPing" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                                <span id="tickerStatusDot" class="relative inline-flex rounded-full h-2 w-2 bg-amber-500"></span>
                            </span>
                        </div>
                    </div>
                    <div id="pipelineJobList" class="grid grid-cols-2 gap-2"></div>
                </div>
            </div>

            <!-- 资讯检索与阅读控制 -->
            <div class="mb-3 flex flex-col gap-2">
                <label class="flex h-10 items-center rounded-lg border border-white/10 bg-black/20 px-3 focus-within:border-white/25 focus-within:bg-black/30">
                    <svg class="h-4 w-4 shrink-0 text-white/40" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <input id="newsSearchInput" type="search" placeholder="搜索快讯、来源或原因" aria-label="搜索快讯"
                        class="min-w-0 flex-1 bg-transparent px-2 text-sm text-white outline-none placeholder:text-white/35">
                </label>
                <div class="flex items-center gap-2">
                    <select id="newsSourceFilter" aria-label="筛选快讯来源"
                        class="h-10 min-w-0 flex-1 rounded-lg border border-white/10 bg-black/25 px-2 text-xs text-white/80 outline-none">
                        <option value="all">全部来源</option>
                    </select>
                    <button id="importantOnlyButton" type="button" aria-pressed="false" title="只看重要快讯"
                        class="h-10 shrink-0 flex items-center gap-1.5 rounded-lg border border-white/10 bg-white/5 px-3 text-xs text-white/65 transition-colors hover:bg-white/10">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v18m0-16h11l-1.5 4L16 13H5"></path>
                        </svg>
                        <span>重要</span><span id="count-important" class="tab-badge"></span>
                    </button>
                    <button id="pauseNewsButton" type="button" aria-pressed="false" title="暂停快讯刷新" aria-label="暂停快讯刷新"
                        class="h-10 w-10 shrink-0 rounded-lg border border-white/10 bg-white/5 text-white/70 transition-colors hover:bg-white/10 flex items-center justify-center">
                        <svg data-pause-icon class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M7 5h3v14H7zm7 0h3v14h-3z"></path>
                        </svg>
                        <svg data-play-icon class="hidden h-4 w-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M8 5v14l11-7z"></path>
                        </svg>
                    </button>
                </div>
                <div id="newsResultMeta" class="text-[10px] text-white/40" aria-live="polite"></div>
            </div>

            <!-- 选项卡切换：滑动高亮指示器 + 分类强调色 + 实时数量角标 -->
            <div id="tabBar" role="tablist" aria-label="快讯分类"
                class="relative flex p-1 mb-4 bg-black/20 rounded-xl border border-white/5 backdrop-blur-md overflow-x-auto no-scrollbar">
                <span id="tabIndicator"
                    class="absolute top-1 bottom-1 left-0 rounded-lg transition-all duration-300 ease-out pointer-events-none"
                    style="width:0"></span>
                <button type="button" id="tab-all" data-filter="all" role="tab" aria-selected="true" aria-controls="newsList" tabindex="0"
                    class="tab-btn relative z-10 flex-1 min-h-10 py-1.5 text-xs rounded-lg transition-all duration-300 shrink-0 min-w-[64px] flex items-center justify-center gap-1">
                    <span>全部</span><span id="count-all" class="tab-badge"></span></button>
                <button type="button" id="tab-news" data-filter="news" role="tab" aria-selected="false" aria-controls="newsList" tabindex="-1"
                    class="tab-btn relative z-10 flex-1 min-h-10 py-1.5 text-xs rounded-lg transition-all duration-300 shrink-0 min-w-[64px] flex items-center justify-center gap-1">
                    <span>国内</span><span id="count-news" class="tab-badge"></span></button>
                <button type="button" id="tab-foreign" data-filter="foreign" role="tab" aria-selected="false" aria-controls="newsList" tabindex="-1"
                    class="tab-btn relative z-10 flex-1 min-h-10 py-1.5 text-xs rounded-lg transition-all duration-300 shrink-0 min-w-[64px] flex items-center justify-center gap-1">
                    <span>外媒</span><span id="count-foreign" class="tab-badge"></span></button>
                <button type="button" id="tab-tech" data-filter="tech" role="tab" aria-selected="false" aria-controls="newsList" tabindex="-1"
                    class="tab-btn relative z-10 flex-1 min-h-10 py-1.5 text-xs rounded-lg transition-all duration-300 shrink-0 min-w-[64px] flex items-center justify-center gap-1">
                    <span>科技</span><span id="count-tech" class="tab-badge"></span></button>
            </div>

            <!-- 滚动列表区 (增加 pb-24 防止被底部行情条挡住) -->
            <div id="newsList" role="tabpanel" aria-labelledby="tab-all" tabindex="0"
                class="flex-none overflow-visible no-scrollbar flex flex-col pb-8 transition-opacity duration-300 md:flex-1 md:overflow-y-auto md:pb-24">
                <div id="newsSkeleton" class="flex flex-col gap-3 p-1">
                    <div class="border-l-2 border-white/10 pl-3 pb-3"><div class="skeleton skeleton-line-sm"></div><div class="skeleton skeleton-line" style="width:90%"></div><div class="skeleton skeleton-line" style="width:60%"></div></div>
                    <div class="border-l-2 border-white/10 pl-3 pb-3"><div class="skeleton skeleton-line-sm"></div><div class="skeleton skeleton-line" style="width:85%"></div><div class="skeleton skeleton-line" style="width:45%"></div></div>
                    <div class="border-l-2 border-white/10 pl-3 pb-3"><div class="skeleton skeleton-line-sm"></div><div class="skeleton skeleton-line" style="width:95%"></div><div class="skeleton skeleton-line" style="width:70%"></div></div>
                    <div class="border-l-2 border-white/10 pl-3 pb-3"><div class="skeleton skeleton-line-sm"></div><div class="skeleton skeleton-line" style="width:80%"></div><div class="skeleton skeleton-line" style="width:55%"></div></div>
                    <div class="border-l-2 border-white/10 pl-3 pb-3"><div class="skeleton skeleton-line-sm"></div><div class="skeleton skeleton-line" style="width:88%"></div><div class="skeleton skeleton-line" style="width:50%"></div></div>
                    <div class="border-l-2 border-white/10 pl-3 pb-3"><div class="skeleton skeleton-line-sm"></div><div class="skeleton skeleton-line" style="width:75%"></div><div class="skeleton skeleton-line" style="width:65%"></div></div>
                    <div class="border-l-2 border-white/10 pl-3 pb-3"><div class="skeleton skeleton-line-sm"></div><div class="skeleton skeleton-line" style="width:92%"></div><div class="skeleton skeleton-line" style="width:40%"></div></div>
                    <div class="border-l-2 border-white/10 pl-3 pb-3"><div class="skeleton skeleton-line-sm"></div><div class="skeleton skeleton-line" style="width:78%"></div><div class="skeleton skeleton-line" style="width:58%"></div></div>
                </div>
            </div>

        </div>
        <!-- 回到资讯顶部按钮 -->
        <button id="backToTop" type="button" disabled aria-hidden="true"
            class="absolute bottom-16 right-6 z-40 w-11 h-11 bg-black/45 backdrop-blur-xl rounded-full flex items-center justify-center cursor-pointer opacity-0 pointer-events-none transition-all duration-300 hover:bg-white/20 active:scale-95 shadow-xl border border-white/20"
            aria-label="回到资讯顶部">
            <svg class="w-5 h-5 text-white/80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18">
                </path>
            </svg>
        </button>
    </aside>

    <!-- 设置中心 -->
    <div id="settingsOverlay" hidden class="fixed inset-0 z-[80] bg-black/55 backdrop-blur-sm">
        <section id="settingsDrawer" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"
            class="absolute right-0 top-0 flex h-full w-full max-w-[460px] flex-col border-l border-white/15 bg-slate-950/95 text-white shadow-2xl">
            <header class="flex h-16 shrink-0 items-center justify-between border-b border-white/10 px-5">
                <h2 id="settingsTitle" class="text-lg font-semibold">设置</h2>
                <button id="closeSettingsButton" type="button" aria-label="关闭设置"
                    class="flex h-10 w-10 items-center justify-center rounded-lg text-white/60 transition-colors hover:bg-white/10 hover:text-white">
                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </header>

            <div role="tablist" aria-label="设置分类" class="grid shrink-0 grid-cols-4 border-b border-white/10 px-3 py-2">
                <button type="button" role="tab" data-settings-tab="general" aria-selected="true"
                    class="settings-tab min-h-10 rounded-md px-2 text-sm">常规</button>
                <button type="button" role="tab" data-settings-tab="shortcuts" aria-selected="false"
                    class="settings-tab min-h-10 rounded-md px-2 text-sm">快捷</button>
                <button type="button" role="tab" data-settings-tab="ticker" aria-selected="false"
                    class="settings-tab min-h-10 rounded-md px-2 text-sm">行情</button>
                <button type="button" role="tab" data-settings-tab="appearance" aria-selected="false"
                    class="settings-tab min-h-10 rounded-md px-2 text-sm">视觉</button>
            </div>

            <div class="min-h-0 flex-1 overflow-y-auto no-scrollbar">
                <div data-settings-panel="general" class="settings-panel">
                    <section class="settings-section">
                        <h3 class="settings-section-title">天气城市</h3>
                        <div class="settings-segmented" role="group" aria-label="天气城市来源">
                            <button id="weatherModeServer" type="button" aria-pressed="true">服务器默认</button>
                            <button id="weatherModeCity" type="button" aria-pressed="false">指定城市</button>
                        </div>
                        <div id="citySettingsBlock" hidden class="mt-4">
                            <div class="flex items-center gap-2">
                                <label class="settings-input-shell flex-1">
                                    <svg class="h-4 w-4 shrink-0 text-white/35" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                    </svg>
                                    <input id="citySearchInput" type="search" placeholder="搜索城市" aria-label="搜索天气城市">
                                </label>
                                <button id="citySearchButton" type="button" aria-label="搜索城市"
                                    class="settings-icon-button">
                                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14m-6-6l6 6-6 6"></path>
                                    </svg>
                                </button>
                            </div>
                            <div id="citySearchStatus" class="mt-2 min-h-4 text-xs text-white/40" aria-live="polite"></div>
                            <div id="citySearchResults" class="mt-2 divide-y divide-white/5"></div>
                        </div>
                        <div class="settings-value-row mt-4">
                            <span>当前城市</span><strong id="selectedCityText">服务器默认</strong>
                        </div>
                    </section>

                    <section class="settings-section">
                        <h3 class="settings-section-title">搜索与资讯</h3>
                        <label class="settings-field-row">
                            <span>搜索引擎</span>
                            <select id="settingsSearchEngine">
                                <option value="bing">必应</option><option value="baidu">百度</option>
                                <option value="google">谷歌</option><option value="duck">DuckDuckGo</option>
                            </select>
                        </label>
                        <label class="settings-field-row">
                            <span>默认分类</span>
                            <select id="settingsNewsCategory">
                                <option value="all">全部</option><option value="news">国内</option>
                                <option value="foreign">外媒</option><option value="tech">科技</option>
                            </select>
                        </label>
                        <label class="settings-field-row">
                            <span>默认来源</span>
                            <select id="settingsNewsSource"><option value="all">全部来源</option></select>
                        </label>
                        <label class="settings-field-row">
                            <span>快讯字号</span>
                            <select id="settingsNewsFontSize">
                                <option value="sm">小</option><option value="base">中</option><option value="lg">大</option>
                            </select>
                        </label>
                        <label class="settings-toggle-row">
                            <span>默认只看重要</span><input id="settingsImportantOnly" type="checkbox"><i></i>
                        </label>
                        <label class="settings-toggle-row">
                            <span>自动刷新快讯</span><input id="settingsAutoRefresh" type="checkbox"><i></i>
                        </label>
                    </section>
                </div>

                <div data-settings-panel="shortcuts" class="settings-panel" hidden>
                    <section class="settings-section">
                        <div class="flex items-center justify-between gap-3">
                            <h3 class="settings-section-title !mb-0">快捷入口</h3>
                            <button id="addShortcutButton" type="button" class="settings-command-button">
                                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v14m-7-7h14"></path>
                                </svg>
                                添加
                            </button>
                        </div>
                        <div id="shortcutSettingsList" class="mt-4 divide-y divide-white/10"></div>
                    </section>
                </div>

                <div data-settings-panel="ticker" class="settings-panel" hidden>
                    <section class="settings-section">
                        <h3 class="settings-section-title">关注行情</h3>
                        <div id="tickerSettingsEmpty" class="py-10 text-center text-sm text-white/35">等待行情数据</div>
                        <div id="tickerSettingsList" class="divide-y divide-white/10"></div>
                    </section>
                </div>

                <div data-settings-panel="appearance" class="settings-panel" hidden>
                    <section class="settings-section">
                        <h3 class="settings-section-title">视觉效果</h3>
                        <label class="settings-toggle-row">
                            <span>天气氛围</span><input id="settingsWeatherEffects" type="checkbox"><i></i>
                        </label>
                        <label class="settings-toggle-row">
                            <span>面板倾斜</span><input id="settingsTilt" type="checkbox"><i></i>
                        </label>
                        <label class="settings-toggle-row">
                            <span>背景涟漪</span><input id="settingsRipple" type="checkbox"><i></i>
                        </label>
                        <label class="settings-toggle-row">
                            <span>省电模式</span><input id="settingsPowerSaving" type="checkbox"><i></i>
                        </label>
                    </section>
                    <section class="settings-section">
                        <button id="resetSettingsButton" type="button"
                            class="min-h-11 w-full rounded-lg border border-red-400/20 text-sm text-red-300 transition-colors hover:bg-red-400/10">
                            恢复默认设置
                        </button>
                    </section>
                </div>
            </div>
        </section>
    </div>

    <!-- 底部：实时行情条 (静态双行滑动布局) -->
    <footer id="bottom-ticker" data-enter style="--enter-delay:0.38s"
        class="fixed bottom-0 left-0 w-full h-[38px] z-50 glass-panel !rounded-none border-x-0 border-b-0 bg-gradient-to-t from-black/50 to-transparent group/ticker">

        <!-- 修复后的翻页按钮：左 -->
        <button type="button" data-ticker-scroll="-500" aria-label="行情向左滚动"
            class="hidden md:flex absolute left-2 top-1/2 -translate-y-1/2 z-50 w-8 h-8 bg-black/50 backdrop-blur-md border border-white/10 rounded-full items-center justify-center opacity-0 group-hover/ticker:opacity-100 transition-all hover:bg-white/20 outline-none shadow-lg">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
        </button>

        <!-- 真正的横向滚动容器 -->
        <div id="tickerScroll"
            class="flex items-center gap-8 px-2 py-1.5 w-full h-full overflow-x-auto no-scrollbar scroll-smooth">
            <div id="tickerContent" class="flex items-center gap-8 min-w-max">
                <div class="skeleton" style="width:80px;height:32px;border-radius:6px"></div>
                <div class="skeleton" style="width:80px;height:32px;border-radius:6px"></div>
                <div class="skeleton" style="width:80px;height:32px;border-radius:6px"></div>
                <div class="skeleton" style="width:80px;height:32px;border-radius:6px"></div>
                <div class="skeleton" style="width:80px;height:32px;border-radius:6px"></div>
                <div class="skeleton" style="width:80px;height:32px;border-radius:6px"></div>
                <div class="skeleton" style="width:80px;height:32px;border-radius:6px"></div>
                <div class="skeleton" style="width:80px;height:32px;border-radius:6px"></div>
            </div>
        </div>

        <!-- 修复后的翻页按钮：右 -->
        <button type="button" data-ticker-scroll="500" aria-label="行情向右滚动"
            class="hidden md:flex absolute right-2 top-1/2 -translate-y-1/2 z-50 w-8 h-8 bg-black/50 backdrop-blur-md border border-white/10 rounded-full items-center justify-center opacity-0 group-hover/ticker:opacity-100 transition-all hover:bg-white/20 outline-none shadow-lg">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
        </button>
    </footer>

    <!-- 应用入口：ES Module。各功能模块在 js/modules/ 下，由 main.js 按依赖顺序启动。 -->
    <script type="module" src="./js/main.js?v=settings-20260716a"></script>
</body>

</html>
