# 携带 ?v= 版本参数的前端静态资源可长缓存 immutable；未带版本参数仍每次重验证。
map $arg_v $static_asset_cache {
    default "public, no-cache, must-revalidate";
    "~.+" "public, max-age=31536000, immutable";
}

# 公共天气代理按 IP 限流并短期缓存，防止滥用同时缓解上游波动。
limit_req_zone $binary_remote_addr zone=weather_api:10m rate=20r/m;
proxy_cache_path /tmp/nginx_weather_cache levels=1:2 keys_zone=weather_cache:4m max_size=32m inactive=10m use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker 内置 DNS 动态解析（避免 control 重建或外部 API IP 变更后 Nginx 缓存过期地址）。
    resolver 127.0.0.11 valid=30s ipv6=off;

    # gzip 压缩：对文本类资源生效。
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        application/xml
        application/rss+xml;

    # 安全头：所有 location 都需要重复声明——
    # nginx 的 add_header 在 location 块出现就会覆盖 server 级，因此用 include 抽公共片段。
    include /etc/nginx/conf.d/security-headers.conf;

    # 屏蔽内部历史缓存及 source map 文件对外暴露。
    location = /translate-cache.json { return 404; }
    location = /github-tech-cache-v2.json { return 404; }
    location ~* \.map$ { return 404; }

    # 首页 HTML 每次校验，避免旧首页引用了已变更的 JS/CSS 版本参数。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    location ^~ /api/admin/ {
        set $control_upstream http://control:1884;
        proxy_pass $control_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 8k;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    location = /api/weather/default {
        set $control_upstream http://control:1884;
        proxy_pass $control_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # 天气与城市检索统一走同源代理，避免客户端网络、CORS 或 CSP 阻断。
    location = /api/weather/geocoding {
        limit_req zone=weather_api burst=12 nodelay;
        limit_req_status 429;
        set $open_meteo_geo https://geocoding-api.open-meteo.com/v1/search;
        proxy_pass $open_meteo_geo$is_args$args;
        proxy_ssl_server_name on;
        proxy_ssl_name geocoding-api.open-meteo.com;
        proxy_set_header Host geocoding-api.open-meteo.com;
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 8s;
        proxy_read_timeout 15s;
        proxy_cache weather_cache;
        proxy_cache_key "$scheme$request_uri";
        proxy_cache_valid 200 5m;
        proxy_cache_use_stale error timeout updating;
        add_header Cache-Control "public, max-age=300" always;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    location = /api/weather/forecast {
        limit_req zone=weather_api burst=12 nodelay;
        limit_req_status 429;
        set $open_meteo_forecast https://api.open-meteo.com/v1/forecast;
        proxy_pass $open_meteo_forecast$is_args$args;
        proxy_ssl_server_name on;
        proxy_ssl_name api.open-meteo.com;
        proxy_set_header Host api.open-meteo.com;
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 8s;
        proxy_read_timeout 15s;
        proxy_cache weather_cache;
        proxy_cache_key "$scheme$request_uri";
        proxy_cache_valid 200 5m;
        proxy_cache_use_stale error timeout updating;
        add_header Cache-Control "public, max-age=300" always;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # 动态数据：允许浏览器保存副本，但每次使用前必须向 Nginx 重验证。
    location ~* \.(json|txt)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # 字体：内容不变，文件名稳定，可长缓存 + immutable，回访零请求。
    location ~* \.(woff2|woff|ttf|otf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # JS / CSS：带 ?v= 参数时走不可变长缓存，不带参数时重验证。
    location ~* \.(js|css)$ {
        add_header Cache-Control $static_asset_cache always;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # 图片：壁纸前端已用 ?v= 做版本控制，favicon 等变动少，1 天缓存。
    location ~* \.(jpg|jpeg|png|webp|ico|svg)$ {
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/conf.d/security-headers.conf;
    }
}
